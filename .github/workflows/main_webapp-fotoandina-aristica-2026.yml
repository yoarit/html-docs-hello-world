
name: Deploy FotoAndina to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_436C31E7319F4C14A336E141994A16BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D089D49FFEA44F778744D4985A7BBCFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8166B015F06844009B0F737F44BA27DA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp-fotoandina-Aristica-2026
          slot-name: Production
          package: .
